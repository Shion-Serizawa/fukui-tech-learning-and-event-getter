# 週次・グループ化。公開から7日未満の版は採らない（cooldown。team.md「依存関係」）。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # 型定義のメジャーは実行環境の Node（mise.toml）に合わせて手で上げる。
      # 先に上げると、実行環境にない API を使っても型検査が通ってしまう。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      all:
        patterns: ["*"]
