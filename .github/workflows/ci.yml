# main への変更は PR を経由し、このワークフローが通ることをマージ条件にする（team.md「Way of Working」）。
# 公開リポジトリなのでフォークから PR が来る。このワークフローにはシークレットを渡さない。
# デプロイは別ワークフロー（on: push の main のみ）で行う。pull_request_target は使わない。
# 第三者製の Action はコミット SHA で固定する（tools/ci-policy.test.ts が検査する）。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型・リント・整形・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run types:check
      - run: npm run test:coverage
      - run: npm run spec:check -- --strict
      - run: npm run build:check

  gitleaks:
    name: シークレット検出
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # gitleaks の Action は、新しいリポジトリへの最初の push で履歴の範囲指定に失敗する
      # （最初のコミットに親がない）。本体をチェックサム付きで取得し、毎回履歴全体を走査する。
      - name: gitleaks で履歴全体を走査する
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  audit:
    name: 依存の脆弱性（表示のみ・ゲートにしない）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - run: npm audit --audit-level=high
